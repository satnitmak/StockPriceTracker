name: StockPriceTracker
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    PRICE_FEED_URL: wss://ws.postman-echo.com/raw
packages:
  StockCore:
    path: Packages/StockCore
targets:
  StockPriceTracker:
    type: application
    platform: iOS
    sources:
      - StockPriceTracker
    dependencies:
      - package: StockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StockPriceTracker
        PRODUCT_NAME: StockPriceTracker
  StockPriceTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StockPriceTrackerTests
    dependencies:
      - target: StockPriceTracker
      - package: StockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StockPriceTrackerTests
schemes:
  StockPriceTracker:
    build:
      targets:
        StockPriceTracker: all
        StockPriceTrackerTests: [test]
    test:
      targets:
        - StockPriceTrackerTests
